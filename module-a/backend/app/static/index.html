<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交子寻味 · 第一阶段调试</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#183b34;background:#f3f5ef;font-size:15px}*{box-sizing:border-box}body{margin:0}.shell{max-width:1160px;margin:auto;padding:28px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px;margin-top:0}.muted{color:#63756d;line-height:1.7}.badge{background:#e0eadf;padding:7px 12px;border-radius:18px;font-size:12px}.grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}.card{background:#fff;border:1px solid #dbe3d8;border-radius:16px;padding:22px;margin-bottom:18px}label{display:block;margin:15px 0 7px;font-weight:600}input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid #cbd7cb;border-radius:8px;background:#fff;color:#183b34}.interests{display:flex;flex-wrap:wrap;gap:8px}.interests label{margin:0;padding:7px 9px;border:1px solid #dbe3d8;border-radius:8px;font-weight:400}.interests input{width:auto;margin-right:4px}button{border:0;border-radius:9px;padding:11px 16px;background:#245e48;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e8eee5;color:#244b3d}.primary{width:100%;margin-top:20px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.stats{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.stat{background:#f0f4ed;border-radius:10px;padding:10px 14px;min-width:120px}.stat strong{display:block;font-size:20px;margin-bottom:4px}.notice{font-size:13px;line-height:1.65;background:#fff4dc;padding:12px;border-radius:10px;color:#715923}.stop{border-left:3px solid #c8dac6;padding:0 0 22px 18px;margin-left:5px}.stop h3{font-size:16px;margin:0 0 7px}.stop p{margin:5px 0;line-height:1.6}#routeMap{display:block;width:100%;height:260px;background:#f1f5ee;border-radius:12px;margin:12px 0}#error{white-space:pre-wrap;line-height:1.6;color:#97372f;background:#fff0eb;border-radius:10px;padding:12px;display:none}.empty{padding:50px 15px;text-align:center}.links{font-size:13px;margin-top:16px}a{color:#245e48}.list-button{display:block;width:100%;text-align:left;margin-top:8px;background:#eef3e9;color:#224f3e;font-size:13px}.route-title{display:flex;justify-content:space-between;gap:10px;align-items:start}@media(max-width:760px){.grid{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:24px}.shell{padding:20px 12px}.card{padding:18px}}
</style></head><body><main class="shell">
<header><div><h1>交子寻味</h1><div class="muted">第二阶段 2A · 对话与路线工具已接通，正式视觉后续按设计稿实现</div></div><span class="badge" id="health">正在连接后端</span></header>
<div class="grid"><aside><form class="card" id="preferences"><h2>安排一段逛吃时间</h2>
<label for="start">从哪里出发</label><select id="start" required></select>
<label for="end">行程终点</label><select id="end"><option value="">最后一站结束</option></select>
<label for="departure">出发时间（北京时间）</label><input id="departure" type="datetime-local" value="2026-10-31T14:00" required>
<label for="duration">可用时间 / 分钟</label><input id="duration" type="number" value="180" min="15" max="720" required>
<label for="budget">每人预算 / 元</label><input id="budget" type="number" value="200" min="0" max="10000" required>
<label>想体验什么</label><div class="interests" id="interests"></div>
<label for="walk">步行上限 / 米</label><input id="walk" type="number" value="3000" min="0" max="15000" required>
<button class="primary" id="generate" type="submit">生成路线</button><div class="links"><a href="/docs" target="_blank" rel="noopener">查看 API 文档</a> · <button type="button" id="reset" class="secondary">新演示会话</button></div></form>
<section class="card"><h2>已保存路线</h2><div id="history" class="muted">加载中…</div></section></aside>
<section><section class="card" id="chatPanel"><h2>用一句话调整行程</h2><p class="muted">例如：预算改成 150 元，保留 IFS，不吃火锅。助手先查询和计算，确认后才保存新路线。</p><textarea id="chatText" maxlength="1000" rows="3" style="width:100%;padding:12px;border:1px solid #cbd7cb;border-radius:9px;font:inherit" placeholder="输入预算、时长、必去地点或想查询的店…"></textarea><div class="actions"><button id="chatSend" type="button">发送给逛吃助手</button><button id="chatApply" type="button" class="secondary" hidden>确认并保存推荐方案</button></div><div id="chatMessages" class="muted" style="white-space:pre-wrap;margin-top:15px"></div></section><div id="error" role="alert"></div><div class="card" id="result"><div class="empty"><h2>先选条件，再生成路线</h2><p class="muted">使用真实地点与百度步行路段。<br>活动、消费和排队为明确标记的演示配置。</p></div></div></section></div>
</main><script>
'use strict';
const el=id=>document.getElementById(id);let sessionToken=localStorage.getItem('jiaozi-demo-session');let currentRoute=null;let places=[];
const interestOptions=[['coffee','咖啡'],['food','美食'],['landmark','地标'],['launch','首发'],['culture','文化'],['lifestyle','逛店'],['hotpot','火锅']];
for(const pair of interestOptions){const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.value=pair[0];check.checked=['coffee','food','landmark'].includes(pair[0]);label.append(check,document.createTextNode(pair[1]));el('interests').append(label);}
function node(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
async function api(path,options){const config=options||{};const response=await fetch('/api/v1'+path,{...config,headers:{'Content-Type':'application/json',...(sessionToken?{'X-Demo-Session':sessionToken}:{}),...(config.headers||{})}});const body=await response.json();if(!response.ok){const error=new Error(body.error?body.error.message:'请求失败');error.details=body.error?body.error.details:{};error.status=response.status;throw error;}return body.data;}
function showError(error){el('error').style.display='block';el('error').textContent=error.message+(error.details&&Object.keys(error.details).length?'\n'+JSON.stringify(error.details,null,2):'');}
function clearError(){el('error').style.display='none';el('error').textContent='';}
async function newSession(){const s=await api('/demo/sessions',{method:'POST',body:JSON.stringify({clock_mode:'demo'})});sessionToken=s.session_token;localStorage.setItem('jiaozi-demo-session',sessionToken);localStorage.removeItem('jiaozi-last-route');currentRoute=null;chatRevision=null;chatDraft=null;chatProposal=null;return s;}
function hhmm(s){return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(s));}
function minutes(seconds){return Math.ceil(seconds/60)+' 分钟';}
function money(fen){return (fen/100).toFixed(0);}
function svgNode(tag,attrs){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const key in attrs)n.setAttribute(key,String(attrs[key]));return n;}
function drawMap(route,container){const svg=svgNode('svg',{viewBox:'0 0 700 260',id:'routeMap',role:'img','aria-label':'真实步行路段示意，非地图导航'});const all=route.legs.flatMap(l=>l.points);if(!all.length)return;const lngs=all.map(p=>p.longitude),lats=all.map(p=>p.latitude);const minX=Math.min(...lngs),maxX=Math.max(...lngs),minY=Math.min(...lats),maxY=Math.max(...lats);const midLat=(minY+maxY)/2*Math.PI/180;const xSpan=Math.max((maxX-minX)*Math.cos(midLat),0.0002),ySpan=Math.max(maxY-minY,0.0002);const scale=Math.min(620/xSpan,190/ySpan);const xy=p=>[350+(p.longitude-(minX+maxX)/2)*Math.cos(midLat)*scale,130-(p.latitude-(minY+maxY)/2)*scale];for(const leg of route.legs){const points=leg.points.map(p=>xy(p).join(',')).join(' ');svg.append(svgNode('polyline',{points,fill:'none',stroke:'#437c58','stroke-width':3,'stroke-linecap':'round'}));}route.stops.forEach((stop,i)=>{const place=places.find(p=>p.place_id===stop.place_id);if(!place)return;const leg=route.legs[i];const stopPoint=leg&&leg.points.length?leg.points[leg.points.length-1]:place;const pos=xy(stopPoint);svg.append(svgNode('circle',{cx:pos[0],cy:pos[1],r:11,fill:'#245e48',stroke:'white','stroke-width':2}));const label=svgNode('text',{x:pos[0],y:pos[1]+4,'text-anchor':'middle',fill:'white','font-size':11});label.textContent=String(i+1);svg.append(label);});container.append(svg);container.append(node('div','真实步行路段示意 · 标记为路段抵达点 · 无底图 · 非导航页面','muted'));}
function renderRoute(route){const pref=route.preferences;if(pref){el('budget').value=String(pref.budget_per_person_fen/100);el('duration').value=String(pref.max_duration_s/60);el('walk').value=String(pref.max_walk_m);el('departure').value=pref.departure_at.slice(0,16);el('start').value=pref.start_place_id;el('end').value=pref.end_place_id||'';for(const box of el('interests').querySelectorAll('input'))box.checked=pref.interests.includes(box.value);}currentRoute=route;localStorage.setItem('jiaozi-last-route',route.route_id);const result=el('result');result.replaceChildren();const title=node('div',undefined,'route-title');title.append(node('h2',route.stops.length+' 站逛吃路线'));title.append(node('span',route.status==='active'?'行程进行中':'待开始','badge'));result.append(title);result.append(node('div',hhmm(route.departure_at)+' 出发 → '+hhmm(route.planned_end_at)+' 结束（含缓冲）','muted'));const stats=node('div',undefined,'stats');for(const pair of [[minutes(route.totals.duration_s),'总耗时'],[route.totals.walk_distance_m+' 米','总步行'],['¥'+money(route.totals.cost_min_per_person_fen)+'–'+money(route.totals.cost_max_per_person_fen),'每人预算估算']]){const box=node('div',undefined,'stat');box.append(node('strong',pair[0]),node('span',pair[1]));stats.append(box);}result.append(stats);drawMap(route,result);const actions=node('div',undefined,'actions');const favorite=node('button',route.is_favorite?'取消收藏':'收藏路线','secondary');favorite.onclick=async()=>{try{renderRoute(await api('/routes/'+route.route_id+'/favorite',{method:'PUT',body:JSON.stringify({favorite:!route.is_favorite})}));await loadHistory();}catch(e){showError(e);}};const start=node('button',route.status==='active'?'已开始':'开始路线');start.disabled=route.status==='active';start.onclick=async()=>{try{renderRoute(await api('/routes/'+route.route_id+'/start',{method:'POST',body:JSON.stringify({base_revision:route.revision})}));await loadHistory();}catch(e){showError(e);}};actions.append(favorite,start);result.append(actions);result.append(node('p',route.warnings.join(' '),'notice'));for(const stop of route.stops){const card=node('article',undefined,'stop');card.append(node('h3',hhmm(stop.arrival_at)+' · '+stop.name));card.append(node('p','步行 '+minutes(stop.walk_duration_s)+' · 等待 '+minutes(stop.wait_duration_s)+' · 排队 '+minutes(stop.queue_duration_s)+' · 停留 '+minutes(stop.dwell_duration_s),'muted'));card.append(node('p',stop.activity_title+'；预计 ¥'+money(stop.cost_min_per_person_fen)+'–'+money(stop.cost_max_per_person_fen)+'/人'));card.append(node('p',stop.recommendation.replace(/\b(coffee|food|landmark|launch|culture|lifestyle|hotpot|tea|photo|local)\b/g,key=>({coffee:'咖啡',food:'美食',landmark:'地标',launch:'首发',culture:'文化',lifestyle:'逛店',hotpot:'火锅',tea:'茶饮',photo:'拍照',local:'本地风味'}[key])),'muted'));for(const benefit of stop.benefits){card.append(node('p',benefit.title+'：'+benefit.conditions,'notice'));}result.append(card);}result.append(node('p','对话和路线工具已接通；打卡、动态调整与交子 DIY 在后续阶段接入。当前可验证规划、收藏、开始和刷新恢复。','muted'));}
async function loadHistory(){const rows=await api('/routes');el('history').replaceChildren();if(!rows.length){el('history').textContent='生成的路线会自动保存。';return;}for(const row of rows.slice(0,10)){const button=node('button',(row.is_favorite?'★ ':'')+row.stops.length+' 站 · '+minutes(row.totals.duration_s)+' · '+hhmm(row.departure_at),'list-button');button.onclick=()=>{clearError();renderRoute(row);};el('history').append(button);}}
el('preferences').addEventListener('submit',async event=>{event.preventDefault();clearError();el('generate').disabled=true;el('generate').textContent='正在校验路线…';try{const body={start_place_id:el('start').value,end_place_id:el('end').value||null,departure_at:el('departure').value+':00+08:00',max_duration_s:Number(el('duration').value)*60,budget_per_person_fen:Math.round(Number(el('budget').value)*100),max_walk_m:Number(el('walk').value),interests:Array.from(el('interests').querySelectorAll('input:checked')).map(n=>n.value)};const route=await api('/routes',{method:'POST',body:JSON.stringify(body)});renderRoute(route);await loadHistory();}catch(e){showError(e);}finally{el('generate').disabled=false;el('generate').textContent='生成路线';}});
el('reset').onclick=async()=>{clearError();try{await newSession();await loadHistory();el('result').replaceChildren(node('h2','已创建新的演示会话'),node('p','请重新生成路线。','muted'));}catch(e){showError(e);}};
async function init(){try{const health=await(await fetch('/health')).json();el('health').textContent=health.places_count+' 个真实地点 · '+health.walking_segments_cached+' 条缓存路段';if(!sessionToken)await newSession();try{places=await api('/places');}catch(e){if(e.status!==401)throw e;await newSession();places=await api('/places');}for(const p of places){const a=node('option',p.name);a.value=p.place_id;el('start').append(a);const b=node('option',p.name);b.value=p.place_id;el('end').append(b);}el('start').value='chunxi_start';await loadHistory();const last=localStorage.getItem('jiaozi-last-route');if(last){try{renderRoute(await api('/routes/'+encodeURIComponent(last)));}catch(e){localStorage.removeItem('jiaozi-last-route');}}}catch(e){el('health').textContent='后端连接异常';showError(e);}}
init();
</script><script>
let chatRevision = null, chatDraft = null, chatProposal = null;
el('chatSend').onclick = async function() {
  const text = el('chatText').value.trim(); if (!text) return;
  clearError(); this.disabled = true; el('chatApply').hidden = true;
  try {
    if (chatRevision === null) { const context = await api('/chat'); chatRevision = context.revision; chatDraft = context.preferences; }
    const payload = {text, context_revision:chatRevision};
    if (chatDraft || currentRoute) payload.current_preferences = chatDraft || currentRoute.preferences;
    if (currentRoute) {payload.route_id=currentRoute.route_id;payload.base_revision=currentRoute.revision;}
    const result = await api('/chat',{method:'POST',body:JSON.stringify(payload)});
    chatRevision=result.context_revision;chatDraft=result.preferences;
    el('chatMessages').textContent += '你：'+text+'\n助手：'+result.reply+'\n\n';
    el('chatText').value='';
    chatProposal=result.status==='proposal'?result:null;
    el('chatApply').hidden=!chatProposal;
  } catch(error) {showError(error);el('chatMessages').textContent+='本次未修改行程。模型不可用时可继续使用表单。\n';}
  finally {this.disabled=false;}
};
el('chatApply').onclick = async function() {
  if(!chatProposal)return;this.disabled=true;
  try {
    const option=chatProposal.route_options[0];
    const saved=await api('/routes',{method:'POST',body:JSON.stringify(option.preferences)});
    renderRoute(saved);await loadHistory();this.hidden=true;chatProposal=null;
  }catch(error){showError(error);}finally{this.disabled=false;}
};
</script></body></html>
